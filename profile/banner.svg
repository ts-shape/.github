<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <defs>
    <linearGradient id="blueAreaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="orangeAreaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d29922" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#d29922" stop-opacity="0.01"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="chartClip">
      <rect x="56" y="22" width="826" height="224"/>
    </clipPath>
    <style>
      .pulse {
        animation: pulse 2.4s ease-in-out infinite;
        transform-origin: 215px 82px;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: 0.5; transform: scale(1.7); }
      }
    </style>
  </defs>

  <!-- ─── CHART BACKGROUND ─────────────────────────────────────── -->
  <rect width="900" height="280" fill="#0d1117"/>

  <!-- Horizontal grid -->
  <line x1="56" y1="47"  x2="882" y2="47"  stroke="#161b22" stroke-width="1"/>
  <line x1="56" y1="97"  x2="882" y2="97"  stroke="#161b22" stroke-width="1"/>
  <line x1="56" y1="147" x2="882" y2="147" stroke="#161b22" stroke-width="1"/>
  <line x1="56" y1="197" x2="882" y2="197" stroke="#161b22" stroke-width="1"/>

  <!-- Vertical grid -->
  <line x1="222" y1="22" x2="222" y2="246" stroke="#161b22" stroke-width="1"/>
  <line x1="388" y1="22" x2="388" y2="246" stroke="#161b22" stroke-width="1"/>
  <line x1="554" y1="22" x2="554" y2="246" stroke="#161b22" stroke-width="1"/>
  <line x1="720" y1="22" x2="720" y2="246" stroke="#161b22" stroke-width="1"/>

  <!-- Axes -->
  <line x1="56" y1="22"  x2="56"  y2="248" stroke="#30363d" stroke-width="1.5"/>
  <line x1="54" y1="246" x2="884" y2="246" stroke="#30363d" stroke-width="1.5"/>

  <!-- Y-axis labels -->
  <text x="48" y="51"  font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#484f58" text-anchor="end">1.0</text>
  <text x="48" y="101" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#484f58" text-anchor="end">.75</text>
  <text x="48" y="151" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#484f58" text-anchor="end">.50</text>
  <text x="48" y="201" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#484f58" text-anchor="end">.25</text>
  <text x="48" y="248" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#484f58" text-anchor="end">0</text>

  <!-- X-axis labels -->
  <text x="222" y="261" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#484f58" text-anchor="middle">+1h</text>
  <text x="388" y="261" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#484f58" text-anchor="middle">+2h</text>
  <text x="554" y="261" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#484f58" text-anchor="middle">+3h</text>
  <text x="720" y="261" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#484f58" text-anchor="middle">+4h</text>
  <text x="882" y="261" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#484f58" text-anchor="middle">+5h</text>

  <!-- ─── SERIES (clipped to chart area) ───────────────────────── -->
  <g clip-path="url(#chartClip)">

    <!-- Orange series — raw / volatile, background -->
    <path d="M60,218 L72,200 L84,152 L96,215 L108,188 L120,62 L132,205 L144,178 L156,222 L168,78 L180,198 L192,145 L204,213 L216,103 L228,208 L240,93 L252,218 L264,158 L276,222 L288,108 L300,213 L312,98 L324,188 L336,168 L348,218 L360,128 L372,204 L384,113 L396,218 L408,172 L420,222 L432,133 L444,198 L456,121 L468,213 L480,158 L492,218 L504,111 L516,203 L528,108 L540,218 L552,173 L564,222 L576,131 L588,198 L600,123 L612,213 L624,155 L636,218 L648,108 L660,202 L672,118 L684,215 L696,160 L708,222 L720,112 L732,203 L744,108 L756,218 L768,151 L780,213 L792,121 L804,193 L816,113 L828,190 L840,125 L852,195 L864,118 L876,188 L882,115"
      fill="none" stroke="#d29922" stroke-width="1" stroke-opacity="0.3" stroke-linejoin="round"/>

    <!-- Green series — trend, smooth dashed, middle layer -->
    <path d="M60,188 C160,182 260,170 360,162 C460,154 560,148 660,152 C760,156 820,150 882,145"
      fill="none" stroke="#3fb950" stroke-width="1.8" stroke-opacity="0.6" stroke-dasharray="5 3"/>

    <!-- Blue area fill -->
    <path d="M60,213 C78,208 88,158 108,143 C128,128 143,180 163,174 C183,168 190,97 213,84 C236,71 246,140 266,145 C286,150 296,110 318,98 C340,86 350,150 370,155 C390,160 400,114 423,102 C446,90 456,164 478,170 C500,176 510,130 533,117 C556,104 563,177 588,182 C613,187 623,137 646,125 C669,113 678,160 703,164 C728,168 736,120 759,110 C782,100 790,152 816,156 C842,160 853,127 876,120 L876,246 L60,246 Z"
      fill="url(#blueAreaGrad)"/>

    <!-- Blue series — main signal, foreground with glow -->
    <path d="M60,213 C78,208 88,158 108,143 C128,128 143,180 163,174 C183,168 190,97 213,84 C236,71 246,140 266,145 C286,150 296,110 318,98 C340,86 350,150 370,155 C390,160 400,114 423,102 C446,90 456,164 478,170 C500,176 510,130 533,117 C556,104 563,177 588,182 C613,187 623,137 646,125 C669,113 678,160 703,164 C728,168 736,120 759,110 C782,100 790,152 816,156 C842,160 853,127 876,120"
      fill="none" stroke="#58a6ff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
  </g>

  <!-- Peak dots -->
  <circle cx="213" cy="84"  r="4.5" fill="#58a6ff" class="pulse"/>
  <circle cx="318" cy="98"  r="3"   fill="#58a6ff" opacity="0.85"/>
  <circle cx="423" cy="102" r="3"   fill="#58a6ff" opacity="0.85"/>
  <circle cx="533" cy="117" r="3"   fill="#58a6ff" opacity="0.85"/>
  <circle cx="646" cy="125" r="3"   fill="#58a6ff" opacity="0.85"/>
  <circle cx="759" cy="110" r="3"   fill="#58a6ff" opacity="0.85"/>

  <!-- ─── LEGEND ──────────────────────────────────────────────── -->
  <rect x="606" y="12" width="270" height="26" rx="4" fill="#161b22" opacity="0.92"/>
  <line x1="616" y1="25" x2="636" y2="25" stroke="#58a6ff" stroke-width="2.2" filter="url(#glow)"/>
  <text x="641" y="29" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#8b949e">signal</text>
  <line x1="686" y1="25" x2="706" y2="25" stroke="#3fb950" stroke-width="1.8" stroke-dasharray="5 3" opacity="0.7"/>
  <text x="711" y="29" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#8b949e">trend</text>
  <line x1="753" y1="25" x2="773" y2="25" stroke="#d29922" stroke-width="1" opacity="0.5"/>
  <text x="778" y="29" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#8b949e">raw</text>

  <!-- ─── TITLE ───────────────────────────────────────────────── -->
  <text x="68" y="22" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" fill="#c9d1d9" font-weight="bold">ts-shape</text>
  <text x="148" y="22" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#484f58"> · time-series · python</text>

  <!-- ─── FEATURE TABLE BACKGROUND ───────────────────────────── -->
  <rect y="280" width="900" height="140" fill="#010409"/>
  <line x1="0"   y1="280" x2="900" y2="280" stroke="#21262d" stroke-width="1"/>

  <!-- Column dividers -->
  <line x1="300" y1="296" x2="300" y2="408" stroke="#21262d" stroke-width="1"/>
  <line x1="600" y1="296" x2="600" y2="408" stroke="#21262d" stroke-width="1"/>

  <!-- ─── COL 1: tsshape ──────────────────────────────────────── -->
  <text x="150" y="316" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" fill="#58a6ff" text-anchor="middle" font-weight="bold">tsshape</text>
  <text x="150" y="334" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#6e7681" text-anchor="middle">Core transforms</text>
  <line x1="80" y1="343" x2="220" y2="343" stroke="#161b22" stroke-width="1"/>
  <text x="88"  y="360" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#3d444d">›</text>
  <text x="100" y="360" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#8b949e">resample · interpolate</text>
  <text x="88"  y="376" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#3d444d">›</text>
  <text x="100" y="376" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#8b949e">normalize · denoise</text>
  <text x="88"  y="392" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#3d444d">›</text>
  <text x="100" y="392" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#8b949e">window · aggregate</text>

  <!-- ─── COL 2: tsshape-io ───────────────────────────────────── -->
  <text x="450" y="316" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" fill="#3fb950" text-anchor="middle" font-weight="bold">tsshape-io</text>
  <text x="450" y="334" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#6e7681" text-anchor="middle">Read &amp; write</text>
  <line x1="380" y1="343" x2="520" y2="343" stroke="#161b22" stroke-width="1"/>
  <text x="388" y="360" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#3d444d">›</text>
  <text x="400" y="360" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#8b949e">CSV · Parquet · JSON</text>
  <text x="388" y="376" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#3d444d">›</text>
  <text x="400" y="376" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#8b949e">streaming ingestion</text>
  <text x="388" y="392" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#3d444d">›</text>
  <text x="400" y="392" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#8b949e">pandas · polars compat</text>

  <!-- ─── COL 3: tsshape-validate ────────────────────────────── -->
  <text x="750" y="316" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" fill="#d29922" text-anchor="middle" font-weight="bold">tsshape-validate</text>
  <text x="750" y="334" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#6e7681" text-anchor="middle">Validate schemas</text>
  <line x1="680" y1="343" x2="820" y2="343" stroke="#161b22" stroke-width="1"/>
  <text x="688" y="360" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#3d444d">›</text>
  <text x="700" y="360" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#8b949e">schema definition</text>
  <text x="688" y="376" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#3d444d">›</text>
  <text x="700" y="376" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#8b949e">type &amp; range checks</text>
  <text x="688" y="392" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#3d444d">›</text>
  <text x="700" y="392" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#8b949e">gap &amp; anomaly detection</text>
</svg>
